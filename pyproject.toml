[project]
name = "sdmodeltester"
version = "0.1.0"
description = "Minimal browser UI for testing SD 1.5 / SDXL single-file checkpoints on a Colab L4"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pillow>=10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "requests>=2.31",  # notebooks/colab_utils.py (preinstalled on Colab)
    "ruff>=0.5",
]
ui = [
    "playwright",
]
inference-cpu = [
    "torch",
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not gpu'"
filterwarnings = [
    # numpy 2 deprecations raised inside diffusers schedulers (inference-cpu group only)
    "ignore::DeprecationWarning:diffusers.*",
    "ignore::DeprecationWarning:numpy.*",
]
markers = [
    "gpu: requires CUDA, torch, diffusers and a real checkpoint (excluded by default)",
    "ui: browser tests in headless Chromium (skipped unless the ui group + browser are installed)",
    "torch: real backend on CPU with tiny random models (skipped unless the inference-cpu group is installed)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["objectives", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]  # Colab form `# @markdown` lines are user-facing prose

[tool.ruff.format]
exclude = ["*.ipynb"]  # generated cell layout; keep Colab form lines as written

# ---------------------------------------------------------------------------
# uv: optional CPU-only inference stack for local tests of the real backend
# with tiny random models (no checkpoints). Not needed for the normal suite.
#   uv sync --group inference-cpu
# ---------------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
